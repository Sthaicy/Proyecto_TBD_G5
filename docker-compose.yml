services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: fuel-monitoring-oracle
    restart: unless-stopped
    ports:
      - "${DB_PORT:-1521}:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?Copy .env.example to .env and set ORACLE_PASSWORD}
      APP_USER: ${APP_USER:-FUEL_APP}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:?Copy .env.example to .env and set APP_USER_PASSWORD}
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./sql:/workspace/sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 2m

volumes:
  oracle-data:
